<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agente Viajero · Fuerza Bruta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --glass: rgba(255,255,255,0.10);
    --glass-strong: rgba(255,255,255,0.18);
    --glass-border: rgba(255,255,255,0.28);
    --ink: #ffffff;
    --ink-dim: rgba(255,255,255,0.65);
    --coral: #ff7a6e;
    --violet: #8c6dfb;
    --mint: #4dd6b3;
    --gold: #ffd166;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; min-height:100%; }
  body{
    font-family:'Inter', sans-serif;
    background:#120e28;
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  .blob{ position:fixed; border-radius:50%; filter:blur(110px); opacity:0.45; z-index:0; animation:drift 24s ease-in-out infinite alternate; }
  .blob1{ width:520px; height:520px; background:var(--violet); top:-200px; left:-180px; }
  .blob2{ width:460px; height:460px; background:var(--coral); bottom:-220px; right:-160px; animation-delay:-9s; }
  .blob3{ width:360px; height:360px; background:var(--mint); top:30%; right:20%; animation-delay:-15s; }
  @keyframes drift{ from{ transform:translate(0,0) scale(1);} to{ transform:translate(40px,-30px) scale(1.1);} }

  header{
    position:relative; z-index:2; padding:26px 32px 14px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand h1{ font-family:'Poppins'; font-size:21px; font-weight:800; margin:0; }
  .brand span{ font-size:22px; }

  .steps{ display:flex; gap:8px; }
  .step-pill{
    font-family:'Poppins'; font-size:12.5px; font-weight:600; padding:7px 14px;
    border-radius:20px; background:var(--glass); border:1px solid var(--glass-border);
    color:var(--ink-dim); transition:all .25s ease;
  }
  .step-pill.active{ background:linear-gradient(135deg,var(--coral),var(--violet)); color:#fff; border-color:transparent; }
  .step-pill.done{ color:var(--mint); }

  main{
    position:relative; z-index:2;
    max-width:1180px; margin:0 auto; padding:10px 32px 60px;
    display:grid; grid-template-columns: 1fr 380px; gap:22px;
  }
  @media (max-width:880px){ main{ grid-template-columns: 1fr; padding:10px 18px 50px; } header{ padding:22px 18px 10px; } }

  .card{
    background:var(--glass); border:1px solid var(--glass-border); border-radius:26px;
    backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%);
    padding:20px;
  }

  .graph-card{ min-height:520px; display:flex; flex-direction:column; }
  .graph-tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .tab-btn{
    font-family:'Poppins'; font-size:13px; font-weight:600; padding:8px 16px; border-radius:14px;
    background:transparent; border:1px solid var(--glass-border); color:var(--ink-dim); cursor:pointer;
  }
  .tab-btn.active{ background:var(--glass-strong); color:var(--ink); }
  .graph-hint{ font-size:13px; color:var(--ink-dim); margin:0 0 10px; min-height:18px; }
  .graph-hint.warn{ color:#ffb3ab; }

  svg{ width:100%; height:auto; touch-action:none; }
  .node-circle{
    cursor:pointer; filter:drop-shadow(0 4px 10px rgba(0,0,0,0.4));
    transition: transform .18s ease, stroke .18s ease;
    transform-box: fill-box; transform-origin: center;
  }
  .node-circle:hover{ transform:scale(1.04); }
  .node-selected{ stroke:var(--gold) !important; stroke-width:3 !important; }
  .edge-label{ font-size:11px; fill:#1a1a2e; font-weight:700; font-family:'Inter'; pointer-events:none; }

  table.matrix{ width:100%; border-collapse:collapse; font-family:'Inter'; font-size:13px; }
  table.matrix th, table.matrix td{ padding:8px 6px; text-align:center; border:1px solid rgba(255,255,255,0.12); }
  table.matrix th{ color:var(--gold); font-weight:700; }
  table.matrix td{ color:var(--ink-dim); }
  table.matrix td.diag{ color:rgba(255,255,255,0.25); }

  h2{ font-family:'Poppins'; font-size:18px; font-weight:700; margin:0 0 4px; }
  p{ color:var(--ink-dim); font-size:13.5px; line-height:1.5; margin:6px 0 0; }

  .btn{
    font-family:'Poppins'; border:none; border-radius:16px; padding:13px 16px; font-size:14.5px;
    font-weight:600; color:var(--ink); cursor:pointer; width:100%; margin-top:10px;
    display:flex; align-items:center; justify-content:center; gap:8px; transition:transform .12s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:linear-gradient(135deg,var(--coral),var(--violet)); box-shadow:0 10px 22px rgba(140,109,251,0.32); }
  .btn-glass{ background:var(--glass-strong); border:1px solid var(--glass-border); }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-row{ display:flex; gap:8px; }
  .btn-row .btn{ margin-top:10px; }

  .stepper-row{ display:flex; align-items:center; justify-content:center; gap:20px; margin:14px 0; }
  .stepper-btn{ width:46px; height:46px; border-radius:50%; border:1px solid var(--glass-border); background:var(--glass-strong); color:var(--ink); font-size:20px; cursor:pointer; }
  #n-display{ font-family:'Poppins'; font-size:36px; font-weight:800; width:56px; text-align:center; }

  .banner{ border-radius:16px; padding:12px 14px; font-size:13px; margin-top:12px; }
  .banner-warn{ background:rgba(255,122,110,0.16); border:1px solid rgba(255,122,110,0.4); color:#ffb3ab; }
  .banner-ok{ background:rgba(77,214,179,0.16); border:1px solid rgba(77,214,179,0.4); color:#a6f3dd; }
  .missing-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .missing-chip{ background:rgba(255,122,110,0.18); border:1px solid rgba(255,122,110,0.45); color:#ffb3ab; font-size:11.5px; padding:4px 9px; border-radius:10px; }

  .stat-row{ display:flex; gap:10px; margin-top:14px; }
  .stat{ flex:1; text-align:center; background:rgba(0,0,0,0.2); border-radius:14px; padding:10px 6px; }
  .stat b{ display:block; font-family:'Poppins'; font-size:19px; }
  .stat span{ font-size:10.5px; color:var(--ink-dim); }

  .route-card{ background:rgba(0,0,0,0.2); border-radius:14px; padding:12px; margin-top:12px; }
  .route-card b{ font-family:'Poppins'; font-size:15px; }
  .route-card .cost{ color:var(--gold); font-weight:700; }

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,8,24,0.55); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    width:290px; background:rgba(30,25,55,0.85); border:1px solid var(--glass-border);
    border-radius:22px; padding:22px; backdrop-filter:blur(20px); text-align:center;
    animation:pop .18s ease;
  }
  @keyframes pop{ from{ transform:scale(0.85); opacity:0;} to{ transform:scale(1); opacity:1;} }
  .modal-card h3{ font-family:'Poppins'; margin:0 0 4px; font-size:17px; }
  .modal-card input{
    width:100%; margin-top:14px; padding:12px; border-radius:12px; text-align:center;
    background:rgba(255,255,255,0.12); border:1px solid var(--glass-border); color:#fff; font-size:16px; outline:none;
  }

  ::-webkit-scrollbar{ width:5px; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.25); border-radius:5px; }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<header>
  <div class="brand"><span>🧭</span><h1>El Agente Viajero</h1></div>
  <div class="steps">
    <div class="step-pill" id="pill-setup">1 · Ciudades</div>
    <div class="step-pill" id="pill-conectar">2 · Conectar</div>
    <div class="step-pill" id="pill-explorar">3 · Explorar</div>
    <div class="step-pill" id="pill-final">4 · Resultado</div>
  </div>
</header>

<main>
  <!-- COLUMNA IZQUIERDA: grafo / matriz -->
  <div class="card graph-card">
    <div class="graph-tabs">
      <button class="tab-btn active" id="tab-grafo" onclick="toggleVista('grafo')">🕸️ Grafo</button>
      <button class="tab-btn" id="tab-matriz" onclick="toggleVista('matriz')">🔢 Matriz</button>
    </div>
    <p class="graph-hint" id="graph-hint">Elige cuántas ciudades quieres explorar para empezar.</p>
    <svg id="svg-main" viewBox="0 0 560 440"></svg>
    <div id="matriz-wrap" style="display:none;"></div>
  </div>

  <!-- COLUMNA DERECHA: panel de control dinámico -->
  <div class="card control-card" id="control-panel"></div>
</main>

<!-- MODAL para pesos -->
<div class="modal-overlay" id="modal-peso">
  <div class="modal-card">
    <h3 id="modal-titulo">Ruta A → B</h3>
    <p>Ingresa la distancia entre estas ciudades</p>
    <input id="modal-input" type="number" min="1" placeholder="Ej. 45">
    <div class="btn-row">
      <button class="btn btn-glass" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarArista()">Guardar</button>
    </div>
    <button class="btn btn-glass" id="btn-quitar" style="display:none;" onclick="quitarArista()">Quitar ruta</button>
  </div>
</div>

<script>
const INF = Infinity;
const MAX_CONEXIONES = 3;           // máximo de rutas por ciudad
const HINT_CONECTAR = 'Toca dos ciudades para conectarlas (máx. 3 rutas por ciudad), o genera un mapa al azar.';
let n = 6;
let nodos = [], matriz = [], posiciones = {};
let fase = 'setup';
let selectedNode = null;
let pendingEdge = null; // [a,b]
let cicloValidos = [];
let exploreIndex = 0;
let mejorCiclo = null, mejorCosto = INF;
let autoplayTimer = null;

const COLORS = ['#ff7a6e','#8c6dfb','#4dd6b3','#ffd166','#5aa9ff','#ff6ec7','#a3e635','#f472b6','#38bdf8','#fb923c'];
const ROUTE_COLORS = ['#ffd166','#fb923c','#4dd6b3','#5aa9ff','#ff6ec7','#a3e635','#8c6dfb','#38bdf8','#f472b6','#ff7a6e'];

function setPill(id){
  ['setup','conectar','explorar','final'].forEach(k=>{
    const el = document.getElementById('pill-'+k);
    el.classList.remove('active','done');
  });
  const orden = ['setup','conectar','explorar','final'];
  const idx = orden.indexOf(id);
  orden.forEach((k,i)=>{
    const el = document.getElementById('pill-'+k);
    if(i<idx) el.classList.add('done');
    if(i===idx) el.classList.add('active');
  });
}

function setHint(texto, warn=false){
  const h = document.getElementById('graph-hint');
  h.textContent = texto;
  h.classList.toggle('warn', warn);
}

function toggleVista(cual){
  document.getElementById('tab-grafo').classList.toggle('active', cual==='grafo');
  document.getElementById('tab-matriz').classList.toggle('active', cual==='matriz');
  document.getElementById('svg-main').style.display = cual==='grafo' ? 'block' : 'none';
  document.getElementById('matriz-wrap').style.display = cual==='matriz' ? 'block' : 'none';
  if(cual==='matriz') renderMatriz();
}

function renderMatriz(){
  let html = '<table class="matrix"><tr><th></th>' + nodos.map(x=>`<th>${x}</th>`).join('') + '</tr>';
  nodos.forEach((a,i)=>{
    html += `<tr><th>${a}</th>`;
    nodos.forEach((b,j)=>{
      const v = matriz[i][j];
      html += i===j ? `<td class="diag">–</td>` : `<td>${v===INF?'∞':v}</td>`;
    });
    html += '</tr>';
  });
  html += '</table>';
  document.getElementById('matriz-wrap').innerHTML = html;
}

// ---------------- grado de cada nodo ----------------
function grado(i){
  let g = 0;
  for(let j=0;j<n;j++) if(j!==i && matriz[i][j]!==INF) g++;
  return g;
}

// ---------------- geometría: evitar que una ruta pase por encima de otra ciudad ----------------
const RADIO_NODO = 19;
const MARGEN_RUTA = 12; // holgura entre la línea y el borde de la ciudad

function distPuntoSegmento(p, a, b){
  const dx = b.x-a.x, dy = b.y-a.y;
  const l2 = dx*dx + dy*dy;
  let t = l2 === 0 ? 0 : ((p.x-a.x)*dx + (p.y-a.y)*dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x-(a.x+t*dx), p.y-(a.y+t*dy));
}

// devuelve el índice de una ciudad que quedaría "tapando" la ruta i–j, o -1 si está libre
function nodoBloqueante(i, j){
  const a = posiciones[nodos[i]], b = posiciones[nodos[j]];
  for(let k=0;k<nodos.length;k++){
    if(k===i || k===j) continue;
    if(distPuntoSegmento(posiciones[nodos[k]], a, b) < RADIO_NODO + MARGEN_RUTA) return k;
  }
  return -1;
}

// ---------------- PANEL 1: SETUP ----------------
function renderSetup(){
  fase = 'setup'; setPill('setup');
  setHint('Elige cuántas ciudades quieres explorar para empezar.');
  document.getElementById('svg-main').innerHTML = '';
  document.getElementById('control-panel').innerHTML = `
    <h2>¿Cuántas ciudades?</h2>
    <p>Entre 5 y 10 nodos para el problema del viajero.</p>
    <div class="stepper-row">
      <button class="stepper-btn" onclick="cambiarN(-1)">−</button>
      <div id="n-display">${n}</div>
      <button class="stepper-btn" onclick="cambiarN(1)">+</button>
    </div>
    <button class="btn btn-primary" onclick="confirmarN()">Crear mapa ►</button>
  `;
}

function cambiarN(delta){
  n = Math.min(10, Math.max(5, n+delta));
  document.getElementById('n-display').textContent = n;
}

function confirmarN(){
  nodos = Array.from({length:n}, (_,i)=>String.fromCharCode(65+i));
  matriz = Array.from({length:n}, (_,i)=>Array.from({length:n}, (_,j)=> i===j?0:INF));
  posiciones = layoutAleatorio(nodos);
  renderConectar();
}

// Posiciones aleatorias por todo el recuadro (con distancia mínima para que no se tapen)
function layoutAleatorio(lista){
  const W = 560, H = 440, margen = 40;
  let minDist = 112; // más separación entre ciudades para evitar choques
  let pos = {};
  for(let intento=0; intento<60; intento++){
    pos = {};
    let ok = true;
    for(const nodo of lista){
      let colocado = false;
      for(let t=0; t<200; t++){
        const x = margen + Math.random()*(W - 2*margen);
        const y = margen + Math.random()*(H - 2*margen);
        const choca = Object.values(pos).some(p => Math.hypot(p.x-x, p.y-y) < minDist);
        if(!choca){ pos[nodo] = {x, y}; colocado = true; break; }
      }
      if(!colocado){ ok = false; break; }
    }
    if(ok) return pos;
    if(intento % 10 === 9) minDist -= 6; // relaja la distancia si cuesta acomodar
  }
  // respaldo: cuadrícula con pequeño desfase aleatorio
  const cols = Math.ceil(Math.sqrt(lista.length));
  const celda = (W - 2*margen) / cols;
  lista.forEach((nodo,i)=>{
    pos[nodo] = {
      x: margen + (i%cols)*celda + celda/2 + (Math.random()-0.5)*celda*0.4,
      y: margen + Math.floor(i/cols)*celda + celda/2 + (Math.random()-0.5)*celda*0.4
    };
  });
  return pos;
}

function reubicarNodos(){
  posiciones = layoutAleatorio(nodos);
  selectedNode = null;
  dibujarGrafo();
  setHint(HINT_CONECTAR);
}

// ---------------- PANEL 2: CONECTAR ----------------
function renderConectar(){
  fase = 'conectar'; setPill('conectar'); selectedNode = null;
  setHint(HINT_CONECTAR);
  dibujarGrafo();
  actualizarControlConectar();
}

function actualizarControlConectar(){
  const hayCiclo = existeCicloValido();
  let banner = '';
  if(matrizTieneAlgunaArista()){
    if(hayCiclo){
      banner = `<div class="banner banner-ok">✅ Ya se puede armar una ruta cerrada que visite todas las ciudades.</div>`;
    } else {
      const falt = aristasFaltantes();
      if(falt.length){
        banner = `<div class="banner banner-warn">Aún falta conectar algunas ciudades para cerrar el circuito:
          <div class="missing-list">${falt.map(([a,b])=>`<span class="missing-chip">${a} – ${b}</span>`).join('')}</div></div>`;
      } else {
        banner = `<div class="banner banner-warn">Con el máximo de 3 rutas por ciudad no se puede cerrar el circuito así. Quita alguna ruta y prueba otra combinación.</div>`;
      }
    }
  }

  document.getElementById('control-panel').innerHTML = `
    <h2>Conecta tus ciudades</h2>
    <p>Haz clic en dos nodos del grafo para trazar una ruta y ponerle una distancia. Cada ciudad admite <b>máximo 3 conexiones</b>.</p>
    <button class="btn btn-glass" onclick="generarAleatorio()">🎲 Generar rutas al azar</button>
    <button class="btn btn-glass" onclick="reubicarNodos()">📍 Reubicar ciudades</button>
    ${banner}
    <button class="btn btn-primary" id="btn-explorar" ${hayCiclo?'':'disabled'} onclick="prepararExplorar()">
      Explorar rutas válidas ►
    </button>
  `;
}

function matrizTieneAlgunaArista(){
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) if(matriz[i][j]!==INF) return true;
  return false;
}

// orden de visita tipo "vecino más cercano" (con algo de azar): genera rutas cortas que rara vez cruzan otras ciudades
function ordenVecinoCercano(){
  const resto = Array.from({length:n}, (_,i)=>i);
  let actual = resto.splice(Math.floor(Math.random()*n), 1)[0];
  const orden = [actual];
  while(resto.length){
    const pa = posiciones[nodos[actual]];
    resto.sort((x,y)=> Math.hypot(posiciones[nodos[x]].x-pa.x, posiciones[nodos[x]].y-pa.y)
                     - Math.hypot(posiciones[nodos[y]].x-pa.x, posiciones[nodos[y]].y-pa.y));
    const idx = (resto.length>1 && Math.random()<0.3) ? 1 : 0;
    actual = resto.splice(idx,1)[0];
    orden.push(actual);
  }
  return orden;
}

function anilloLibre(orden){
  for(let k=0;k<n;k++){
    if(nodoBloqueante(orden[k], orden[(k+1)%n]) !== -1) return false;
  }
  return true;
}

function generarAleatorio(){
  // buscar un anillo base (circuito que visita todas las ciudades) cuyas rutas no pasen sobre otras ciudades
  let orden = null;
  for(let reintento=0; reintento<30 && !orden; reintento++){
    for(let t=0; t<250; t++){
      const cand = t<200 ? ordenVecinoCercano() : Array.from({length:n}, (_,i)=>i).sort(()=>Math.random()-0.5);
      if(anilloLibre(cand)){ orden = cand; break; }
    }
    if(!orden) posiciones = layoutAleatorio(nodos); // si no se logra, se reubican las ciudades
  }
  if(!orden) orden = ordenVecinoCercano();

  // limpiar rutas previas
  for(let i=0;i<n;i++) for(let j=0;j<n;j++) matriz[i][j] = i===j ? 0 : INF;

  // anillo base: cada nodo queda con 2 conexiones
  for(let k=0;k<n;k++){
    const a = orden[k], b = orden[(k+1)%n];
    const peso = 1+Math.floor(Math.random()*100);
    matriz[a][b] = peso; matriz[b][a] = peso;
  }
  // rutas extra al azar: ambos nodos con menos de 3 conexiones y sin pasar sobre otra ciudad
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    if(matriz[i][j]===INF && grado(i)<MAX_CONEXIONES && grado(j)<MAX_CONEXIONES
       && nodoBloqueante(i,j)===-1 && Math.random()<0.4){
      const peso = 1+Math.floor(Math.random()*100);
      matriz[i][j] = peso; matriz[j][i] = peso;
    }
  }
  dibujarGrafo();
  actualizarControlConectar();
}

// clic en nodo para conectar
function onNodeClick(nodo){
  if(fase !== 'conectar') return;
  if(selectedNode === null){
    selectedNode = nodo;
    dibujarGrafo();
    setHint(`${nodo} seleccionado (${grado(nodos.indexOf(nodo))}/${MAX_CONEXIONES} conexiones) → toca otra ciudad para conectarla.`);
    return;
  }
  if(selectedNode === nodo){
    selectedNode = null;
    dibujarGrafo();
    setHint(HINT_CONECTAR);
    return;
  }
  const a = selectedNode, b = nodo;
  const i = nodos.indexOf(a), j = nodos.indexOf(b);
  const existe = matriz[i][j] !== INF;
  selectedNode = null;

  // regla: máximo 3 conexiones por nodo (solo bloquea rutas nuevas)
  if(!existe){
    if(grado(i) >= MAX_CONEXIONES){
      dibujarGrafo();
      setHint(`${a} ya tiene ${MAX_CONEXIONES} conexiones. Quita una ruta de ${a} para poder agregar otra.`, true);
      return;
    }
    if(grado(j) >= MAX_CONEXIONES){
      dibujarGrafo();
      setHint(`${b} ya tiene ${MAX_CONEXIONES} conexiones. Quita una ruta de ${b} para poder agregar otra.`, true);
      return;
    }
  }
  // regla: la ruta no debe pasar por encima de otra ciudad
  if(!existe){
    const bl = nodoBloqueante(i, j);
    if(bl !== -1){
      dibujarGrafo();
      setHint(`La ruta ${a}–${b} pasaría por encima de ${nodos[bl]}. Conecta primero con ${nodos[bl]} o reubica las ciudades.`, true);
      return;
    }
  }
  abrirModalArista(a, b);
}

function abrirModalArista(a,b){
  pendingEdge = [a,b];
  const i = nodos.indexOf(a), j = nodos.indexOf(b);
  const existe = matriz[i][j] !== INF;
  document.getElementById('modal-titulo').textContent = `Ruta ${a} → ${b}`;
  document.getElementById('modal-input').value = existe ? matriz[i][j] : '';
  document.getElementById('btn-quitar').style.display = existe ? 'block' : 'none';
  document.getElementById('modal-peso').classList.add('open');
  setTimeout(()=>document.getElementById('modal-input').focus(), 50);
}

function cerrarModal(){
  document.getElementById('modal-peso').classList.remove('open');
  pendingEdge = null;
  dibujarGrafo();
  setHint(HINT_CONECTAR);
}

function guardarArista(){
  const peso = parseInt(document.getElementById('modal-input').value);
  if(!peso || peso<=0){ document.getElementById('modal-input').style.borderColor = 'var(--coral)'; return; }
  const [a,b] = pendingEdge;
  const i=nodos.indexOf(a), j=nodos.indexOf(b);
  matriz[i][j]=peso; matriz[j][i]=peso;
  document.getElementById('modal-peso').classList.remove('open');
  pendingEdge = null;
  dibujarGrafo();
  actualizarControlConectar();
  setHint(HINT_CONECTAR);
}

function quitarArista(){
  const [a,b] = pendingEdge;
  const i=nodos.indexOf(a), j=nodos.indexOf(b);
  matriz[i][j]=INF; matriz[j][i]=INF;
  document.getElementById('modal-peso').classList.remove('open');
  pendingEdge = null;
  dibujarGrafo();
  actualizarControlConectar();
  setHint(HINT_CONECTAR);
}

// ---------------- lógica de ciclos ----------------
function permutar(arr){
  if(arr.length<=1) return [arr];
  const res=[];
  for(let i=0;i<arr.length;i++){
    const resto = arr.slice(0,i).concat(arr.slice(i+1));
    for(const p of permutar(resto)) res.push([arr[i],...p]);
  }
  return res;
}

// Búsqueda por retroceso: solo recorre caminos que existen en el grafo
// (con máx. 3 conexiones por nodo es muy rápida). Si soloUno=true se detiene al primer ciclo.
function buscarCiclos(soloUno){
  const resultado = [];
  const visitado = Array(n).fill(false);
  const camino = [0];
  visitado[0] = true;

  function dfs(actual){
    if(soloUno && resultado.length>0) return;
    if(camino.length === n){
      if(matriz[actual][0] !== INF){
        resultado.push([...camino, 0].map(k=>nodos[k]));
      }
      return;
    }
    for(let sig=1; sig<n; sig++){
      if(!visitado[sig] && matriz[actual][sig] !== INF){
        visitado[sig] = true; camino.push(sig);
        dfs(sig);
        camino.pop(); visitado[sig] = false;
        if(soloUno && resultado.length>0) return;
      }
    }
  }
  dfs(0);
  return resultado;
}

function existeCicloValido(){
  if(!matrizTieneAlgunaArista()) return false;
  return buscarCiclos(true).length > 0;
}

// Aristas que faltarían para cerrar un circuito, respetando el máximo de 3 conexiones
function aristasFaltantes(){
  const perms = permutar(nodos.slice(1));
  let mejor = null;
  for(const p of perms){
    const ciclo=[nodos[0],...p,nodos[0]];
    const falt=[];
    for(let i=0;i<ciclo.length-1;i++){
      const a=nodos.indexOf(ciclo[i]), b=nodos.indexOf(ciclo[i+1]);
      if(matriz[a][b]===INF) falt.push([ciclo[i],ciclo[i+1]]);
    }
    if(mejor!==null && falt.length>=mejor.length) continue;

    // comprobar que agregar esas rutas no pase de 3 conexiones en ningún nodo
    const extra = Array(n).fill(0);
    falt.forEach(([x,y])=>{ extra[nodos.indexOf(x)]++; extra[nodos.indexOf(y)]++; });
    let valido = true;
    for(let k=0;k<n;k++) if(grado(k)+extra[k] > MAX_CONEXIONES){ valido=false; break; }
    if(valido) mejor = falt;
  }
  return mejor || [];
}

function calcularCiclosValidos(){
  return buscarCiclos(false);
}
function costoDeCiclo(ciclo){
  let c=0;
  for(let i=0;i<ciclo.length-1;i++){
    const a=nodos.indexOf(ciclo[i]), b=nodos.indexOf(ciclo[i+1]);
    c += matriz[a][b];
  }
  return c;
}

// ---------------- PANEL 3: EXPLORAR ----------------
function prepararExplorar(){
  cicloValidos = calcularCiclosValidos();
  exploreIndex = 0; mejorCiclo=null; mejorCosto=INF;
  fase = 'explorar'; setPill('explorar'); selectedNode=null;
  setHint(`${cicloValidos.length} ruta(s) cerrada(s) posibles. Vamos a compararlas.`);
  dibujarGrafo();
  renderControlExplorar();
}

function renderControlExplorar(){
  document.getElementById('control-panel').innerHTML = `
    <h2>Explorando rutas válidas</h2>
    <p>Cada ruta cerrada se traza sobre el mapa y comparamos su costo total.</p>
    <div class="stat-row">
      <div class="stat"><b id="stat-progreso">0/${cicloValidos.length}</b><span>evaluadas</span></div>
      <div class="stat"><b id="stat-mejor">–</b><span>mejor costo</span></div>
    </div>
    <div class="route-card" id="route-card" style="display:none;">
      <b id="route-path"></b><br>
      <span>Costo: <span class="cost" id="route-cost"></span></span>
    </div>
    <div class="btn-row">
      <button class="btn btn-glass" id="btn-auto" onclick="toggleAutoplay()">▶ Auto</button>
      <button class="btn btn-primary" id="btn-siguiente" onclick="siguienteRuta()">Siguiente ruta ►</button>
    </div>
  `;
}

function siguienteRuta(){
  if(exploreIndex >= cicloValidos.length){
    mostrarFinal();
    return;
  }
  const ciclo = cicloValidos[exploreIndex];
  const costo = costoDeCiclo(ciclo);
  const esMejor = costo < mejorCosto;
  if(esMejor){ mejorCosto = costo; mejorCiclo = ciclo; }

  const colorRuta = ROUTE_COLORS[exploreIndex % ROUTE_COLORS.length];
  animarCiclo(ciclo, colorRuta);

  document.getElementById('route-card').style.display = 'block';
  document.getElementById('route-path').innerHTML = `<span style="color:${colorRuta}">${ciclo.join(' → ')}</span>`;
  document.getElementById('route-cost').textContent = costo + (esMejor ? ' ★ ¡nuevo mejor!' : '');
  document.getElementById('stat-progreso').textContent = `${exploreIndex+1}/${cicloValidos.length}`;
  document.getElementById('stat-mejor').textContent = mejorCosto;

  exploreIndex++;
  if(exploreIndex >= cicloValidos.length){
    document.getElementById('btn-siguiente').textContent = 'Ver resultado final ►';
    document.getElementById('btn-auto').disabled = true;
    pararAutoplay();
  }
}

function toggleAutoplay(){
  if(autoplayTimer){ pararAutoplay(); return; }
  document.getElementById('btn-auto').textContent = '⏸ Pausar';
  autoplayTimer = setInterval(()=>{
    if(exploreIndex >= cicloValidos.length){ pararAutoplay(); return; }
    siguienteRuta();
  }, 1100);
}
function pararAutoplay(){
  clearInterval(autoplayTimer);
  autoplayTimer = null;
  const b = document.getElementById('btn-auto');
  if(b) b.textContent = '▶ Auto';
}

// ---------------- PANEL 4: FINAL ----------------
function mostrarFinal(){
  fase = 'final'; setPill('final'); pararAutoplay();
  setHint('Esta es la ruta más corta posible para tu mapa.');
  dibujarGrafo();
  animarCiclo(mejorCiclo, '#ff7a6e', true);

  document.getElementById('control-panel').innerHTML = `
    <h2>🏁 Ruta óptima encontrada</h2>
    <div class="route-card">
      <b>${mejorCiclo.join(' → ')}</b>
    </div>
    <div class="stat-row">
      <div class="stat"><b>${mejorCosto}</b><span>costo mínimo</span></div>
      <div class="stat"><b>${cicloValidos.length}</b><span>rutas válidas</span></div>
      <div class="stat"><b>${Math.floor(cicloValidos.length/2)}</b><span>únicas</span></div>
    </div>
    <button class="btn btn-primary" onclick="reiniciar()">Jugar de nuevo 🔁</button>
  `;
}

function reiniciar(){
  pararAutoplay();
  n = 6;
  renderSetup();
}

// ---------------- DIBUJO Y ANIMACIÓN ----------------
function dibujarGrafo(){
  const svg = document.getElementById('svg-main');
  svg.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';

  // 1) aristas base (líneas grises, sin nada encima todavía)
  for(let i=0;i<nodos.length;i++){
    for(let j=i+1;j<nodos.length;j++){
      if(matriz[i][j]!==INF){
        const p1=posiciones[nodos[i]], p2=posiciones[nodos[j]];
        const line=document.createElementNS(ns,'line');
        line.setAttribute('x1',p1.x); line.setAttribute('y1',p1.y);
        line.setAttribute('x2',p2.x); line.setAttribute('y2',p2.y);
        line.setAttribute('stroke','rgba(255,255,255,0.32)'); line.setAttribute('stroke-width','2');
        svg.appendChild(line);
      }
    }
  }

  // 2) capa vacía donde se dibujarán las rutas resaltadas (queda DEBAJO de textos y nodos)
  const routeLayer = document.createElementNS(ns,'g');
  routeLayer.setAttribute('id','route-layer');
  svg.appendChild(routeLayer);

  // 3) etiquetas de peso (van encima de la capa de rutas)
  // la etiqueta se desplaza a lo largo de la ruta para no quedar sobre una ciudad ni sobre otra etiqueta
  const etiquetasColocadas = [];
  const posiblesT = [0.5, 0.4, 0.6, 0.33, 0.67, 0.25, 0.75];
  for(let i=0;i<nodos.length;i++){
    for(let j=i+1;j<nodos.length;j++){
      if(matriz[i][j]!==INF){
        const p1=posiciones[nodos[i]], p2=posiciones[nodos[j]];

        let mejor = null, mejorPuntaje = Infinity;
        for(const t of posiblesT){
          const px = p1.x + (p2.x-p1.x)*t, py = p1.y + (p2.y-p1.y)*t;
          let puntaje = 0;
          nodos.forEach(nd=>{
            const q = posiciones[nd];
            const d = Math.hypot(q.x-px, q.y-py);
            if(d < RADIO_NODO + 15) puntaje += (RADIO_NODO + 15 - d) * 3;
          });
          etiquetasColocadas.forEach(e=>{
            const d = Math.hypot(e.x-px, e.y-py);
            if(d < 30) puntaje += (30 - d) * 3;
          });
          if(puntaje < mejorPuntaje){ mejorPuntaje = puntaje; mejor = {x:px, y:py}; }
          if(puntaje === 0) break;
        }
        etiquetasColocadas.push(mejor);

        const bg=document.createElementNS(ns,'circle');
        bg.setAttribute('cx',mejor.x); bg.setAttribute('cy',mejor.y); bg.setAttribute('r',12); bg.setAttribute('fill','#fff');
        svg.appendChild(bg);
        const txt=document.createElementNS(ns,'text');
        txt.setAttribute('x',mejor.x); txt.setAttribute('y',mejor.y+4); txt.setAttribute('text-anchor','middle');
        txt.setAttribute('class','edge-label'); txt.textContent = matriz[i][j];
        svg.appendChild(txt);
      }
    }
  }

  // 4) nodos (siempre encima de todo)
  nodos.forEach((nodo,idx)=>{
    const p = posiciones[nodo];
    const g = document.createElementNS(ns,'g');
    const circle = document.createElementNS(ns,'circle');
    circle.setAttribute('cx',p.x); circle.setAttribute('cy',p.y); circle.setAttribute('r',19);
    circle.setAttribute('fill', COLORS[idx % COLORS.length]);
    circle.setAttribute('class','node-circle' + (selectedNode===nodo ? ' node-selected' : ''));
    circle.setAttribute('stroke','white'); circle.setAttribute('stroke-width','2');
    circle.addEventListener('click', ()=>onNodeClick(nodo));
    g.appendChild(circle);
    const text = document.createElementNS(ns,'text');
    text.setAttribute('x',p.x); text.setAttribute('y',p.y+5); text.setAttribute('text-anchor','middle');
    text.setAttribute('fill','white'); text.setAttribute('font-weight','700');
    text.setAttribute('font-family','Poppins'); text.setAttribute('font-size','14');
    text.setAttribute('pointer-events','none');
    text.textContent = nodo;
    g.appendChild(text);
    svg.appendChild(g);
  });
}

function animarCiclo(ciclo, color, grueso=false){
  const ns = 'http://www.w3.org/2000/svg';
  const layer = document.getElementById('route-layer');
  if(!layer) return;
  layer.innerHTML = ''; // borra la ruta anterior antes de trazar la nueva

  for(let i=0;i<ciclo.length-1;i++){
    const p1 = posiciones[ciclo[i]], p2 = posiciones[ciclo[i+1]];
    const largo = Math.hypot(p2.x-p1.x, p2.y-p1.y);
    const line = document.createElementNS(ns,'line');
    line.setAttribute('x1',p1.x); line.setAttribute('y1',p1.y);
    line.setAttribute('x2',p2.x); line.setAttribute('y2',p2.y);
    line.setAttribute('stroke', color);
    line.setAttribute('stroke-width', grueso ? '5' : '4');
    line.setAttribute('stroke-linecap','round');
    line.style.strokeDasharray = largo;
    line.style.strokeDashoffset = largo;
    line.style.transition = 'stroke-dashoffset .35s ease';
    layer.appendChild(line);
    setTimeout(()=>{ line.style.strokeDashoffset = '0'; }, 40 + i*160);

    // pulso en el nodo de llegada (también dentro de la capa, no tapa las letras)
    setTimeout(()=>{
      const p = posiciones[ciclo[i+1]];
      const pulse = document.createElementNS(ns,'circle');
      pulse.setAttribute('cx',p.x); pulse.setAttribute('cy',p.y); pulse.setAttribute('r',19);
      pulse.setAttribute('fill','none'); pulse.setAttribute('stroke',color); pulse.setAttribute('stroke-width','3');
      pulse.style.opacity='0.9'; pulse.style.transition='all .5s ease';
      layer.appendChild(pulse);
      requestAnimationFrame(()=>{
        pulse.setAttribute('r','30'); pulse.style.opacity='0';
      });
      setTimeout(()=>pulse.remove(), 550);
    }, 40 + i*160 + 200);
  }
}

// init
renderSetup();
</script>
